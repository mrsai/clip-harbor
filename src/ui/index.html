<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><title>ClipHarbor</title><link rel="stylesheet" href="style.css"></head>
<body class="desktop">
<aside class="sidebar">
 <div class="brand">ClipHarbor</div>
 <button class="nav active" id="links-tab">收藏 <span id="total">0</span></button>
 <button class="nav" id="lan-tab">局域网互传</button>
 <div class="side-heading">区域 <button id="import-side" title="导入文本文件" aria-label="导入文本文件">＋</button></div>
 <div id="groups" class="group-tree"></div>
 <button id="clear-all" class="danger">清空全部数据</button>
</aside>
<main>
 <section id="links-view">
  <div class="page-title"><h1>收藏</h1><div class="actions"><span id="monitor-label" class="muted">监听已暂停</span><button class="primary" id="monitor">开启监听</button><button id="import">导入文本</button></div></div>
  <form id="settings" class="settings"><label>常用阈值 n <input id="n" aria-label="常用阈值 n" type="number" min="1" max="10000" required value="5"></label><label>每组上限 m <input id="m" aria-label="每组上限 m" type="number" min="1" max="10000" required value="50"></label><button type="submit">保存规则</button><span class="muted">少于 n 条进入常用；超过 m 条分组</span></form>
  <div class="section-toolbar"><div><input id="group-title" class="title-input" aria-label="当前区域名称" maxlength="100"><span id="group-count" class="muted"></span></div><div><button id="share-group">发送到手机</button><button id="remove" class="danger">清空区域</button><button id="copy-group" class="dark">复制区域</button></div></div>
  <div id="content"></div>
 </section>
 <section id="lan-view" hidden>
  <div class="page-title"><h1>局域网互传</h1><button id="lan-toggle" class="primary">启动服务</button></div>
  <div class="connection-panel"><div><h2 id="lan-status">服务未启动</h2><p>手机连接同一 Wi-Fi，扫码访问。</p><div id="addresses"></div></div><img id="qr" alt="手机扫码连接二维码" hidden></div>
  <div class="transfer-compose"><h2>发送内容</h2><label for="share-text" class="muted">文字或链接</label><textarea id="share-text" placeholder="输入要发送的内容" maxlength="1000000"></textarea><div><button id="share-files">添加文件</button><button id="send-text" class="dark">发送文字</button></div></div>
  <div class="section-toolbar"><h2>传输记录</h2></div><div id="transfers"></div>
 </section>
 <footer class="storage"><span>本地文件：</span><code id="storage-path"></code><button id="open-storage">打开位置</button></footer>
</main>
<dialog id="delete-dialog"><form method="dialog"><h2>移除区域内容？</h2><p>删除所选区域及其中的链接，此操作不可撤销。</p><div class="dialog-actions"><button value="cancel">取消</button><button value="remove" class="danger">确认移除</button></div></form></dialog>
<dialog id="link-qr-dialog"><form method="dialog"><div class="section-toolbar"><h2>链接二维码</h2><button>关闭</button></div><img id="link-qr" alt="链接二维码"><textarea id="qr-link-text" aria-label="二维码链接" readonly></textarea></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
