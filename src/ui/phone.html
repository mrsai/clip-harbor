<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipHarbor · 设备互传</title><link rel="stylesheet" href="style.css"></head><body class="phone"><div class="brand"><span class="logo">⌘</span><div>ClipHarbor<small>你的设备，已在同一港湾</small></div></div><div class="eyebrow">CONNECTED / LOCAL NETWORK</div><h1>隔空，传点什么<span class="accent">.</span></h1><p class="intro">通过当前局域网直接传送。电脑需要保持应用与互传服务开启。</p><div class="transfer-compose"><h2>发送到电脑</h2><label for="text">文字或链接</label><textarea id="text" placeholder="输入文字、粘贴链接…" maxlength="1000000"></textarea><div><button id="send-text" class="dark">发送文字 ↗</button></div><label for="files" class="upload">选择文件（单个不超过 2 GB，每次最多 20 个）</label><input id="files" type="file" multiple><div><button id="send-files" class="primary">上传文件 ↑</button></div><p id="phone-status" role="status" aria-live="polite"></p></div><div class="section-toolbar"><h2>共享内容</h2><button id="refresh">刷新</button></div><div id="items"></div><script src="phone.js"></script></body></html>
